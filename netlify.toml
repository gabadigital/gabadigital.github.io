[build]
  base = "web"
  command = "npm run build"
  publish = "web/.next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Root → default locale (belt-and-suspenders with Next middleware)
[[redirects]]
  from = "/"
  to = "/en"
  status = 302
  force = true

# Legacy HTML → Next.js App Router (Phase 6 cutover)
[[redirects]]
  from = "/index.html"
  to = "/en"
  status = 301

[[redirects]]
  from = "/about.html"
  to = "/en/about"
  status = 301

[[redirects]]
  from = "/services.html"
  to = "/en/services"
  status = 301

